name: Native builds

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: windows
            artifact: pinterest-board-downloader-windows
          - os: macos-latest
            profile: macos
            artifact: pinterest-board-downloader-macos
          - os: ubuntu-latest
            profile: debian
            artifact: pinterest-board-downloader-debian

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "25"
          cache: maven

      - name: Install Debian packaging tools
        if: matrix.profile == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot

      - name: Build native package
        run: mvn --batch-mode --no-transfer-progress clean verify -P${{ matrix.profile }}

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/dist/**
          if-no-files-found: error
